// ========================================================================
// APP STATE
// ========================================================================
var currentDay = 0;
var renderToken = 0;
var routeCache = {};
var map, markersLayer, routesLayer;
var markerGroup = [];
var routePolylines = [];

// ========================================================================
// INIT MAP
// ========================================================================
function initMap() {
  map = L.map('map', {
    center: [46.5, 2.5],
    zoom: 6,
    zoomControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  routesLayer = L.layerGroup().addTo(map);
}

// ========================================================================
// DAY COLORS
// ========================================================================
var dayColors = [
  '#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261',
  '#264653', '#6d597a', '#b56576', '#219ebc', '#ffb703',
  '#7b2cbf', '#006d77'
];

// ========================================================================
// RENDER DAY
// ========================================================================
function renderDay(dayIdx) {
  currentDay = dayIdx;
  renderToken++;
  var myToken = renderToken;
  var day = itinerary[dayIdx];

  // Clear layers
  markersLayer.clearLayers();
  routesLayer.clearLayers();
  markerGroup = [];
  routePolylines = [];

  // Update tabs
  document.querySelectorAll('.day-tab, .mob-day-tab').forEach(function(el) {
    el.classList.remove('active');
  });
  document.querySelectorAll('[data-day="day-' + dayIdx + '"]').forEach(function(el) {
    el.classList.add('active');
  });

  // Update spot panel header
  document.getElementById('dayBadge').textContent = day.dayLabel;
  document.getElementById('dayTitle').textContent = formatDate(day.date) + ' ' + day.weekday + ' · ' + day.city;

  // Update spot list
  var listEl = document.getElementById('spotList');
  listEl.innerHTML = '';

  // Route summary at top of spot list
  var routeSummary = document.createElement('div');
  routeSummary.style.cssText = 'padding:10px 16px;background:#f8f6f3;border-bottom:1px solid #eee;font-size:0.75rem;color:#666;line-height:1.6;';
  var routeText = day.spots.map(function(s, si) {
    return (si + 1) + '. ' + s.name;
  }).join(' → ');
  routeSummary.innerHTML = '<strong style="color:#1a1a2e;">今日路线：</strong><br>' + routeText;
  if (day.summary) {
    routeSummary.innerHTML += '<div style="margin-top:4px;font-size:0.72rem;color:#999;">' + day.summary + '</div>';
  }
  listEl.appendChild(routeSummary);
  day.spots.forEach(function(spot, si) {
    var div = document.createElement('button');
    div.className = 'spot-item';
    var tagsHtml = buildSpotTagsHtml(spot);
    var quickInfoHtml = buildSpotQuickInfoHtml(spot);
    div.innerHTML =
      '<div class="spot-dot" style="background:' + dayColors[dayIdx % dayColors.length] + '"></div>' +
      '<div class="spot-name"><strong>' + spot.name + '</strong>' +
      (spot.nameEn ? '<div class="spot-name-en">' + spot.nameEn + '</div>' : '') +
      tagsHtml + quickInfoHtml + '</div>';
    div.addEventListener('click', function(e) {
      // Don't open modal if clicking on a link inside quick info
      if (e.target.tagName === 'A') return;
      openModal(dayIdx, si);
    });
    listEl.appendChild(div);
  });

  // Add markers
  var bounds = [];
  day.spots.forEach(function(spot, si) {
    if (!spot.lat || !spot.lng) return;
    var markerColor = dayColors[dayIdx % dayColors.length];
    var marker = L.marker([spot.lat, spot.lng], {
      icon: L.divIcon({
        className: 'custom-marker',
        html: '<div style="width:32px;height:32px;background:' + markerColor + ';color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #fff;">' + (si + 1) + '</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      })
    });

    marker.bindPopup(
      '<strong>' + spot.name + '</strong>' +
      (spot.nameEn ? '<br><span style="color:#999;font-size:0.8rem;">' + spot.nameEn + '</span>' : '') +
      '<br><br><button onclick="openModal(' + dayIdx + ',' + si + ')" style="padding:4px 12px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem;">查看详情 →</button>'
    );

    markersLayer.addLayer(marker);
    bounds.push([spot.lat, spot.lng]);
  });

  // Add route line — fetch real driving route from OSRM
  var routePoints = day.spots.filter(function(s) { return s.lat && s.lng; }).map(function(s) { return [s.lat, s.lng]; });
  if (routePoints.length >= 2) {
    var routeColor = dayColors[dayIdx % dayColors.length];
    // Draw temporary straight dashed line first
    var tempRoute = L.polyline(routePoints, {
      color: routeColor, weight: 2, opacity: 0.4, dashArray: '6, 8'
    }).addTo(routesLayer);
    routePolylines.push(tempRoute);
    // Fetch real driving route
    fetchDrivingRoute(routePoints, routeColor, dayIdx, myToken);
  }

  // Fit map
  if (bounds.length > 0) {
    var b = L.latLngBounds(bounds);
    map.fitBounds(b, { padding: [50, 50], maxZoom: 13 });
  }
}

// ========================================================================
// ROUTE FETCHING — real driving routes via OSRM
// ========================================================================
function fetchDrivingRoute(points, color, dayIdx, token) {
  var cacheKey = points.map(function(p) { return p[0].toFixed(4) + ',' + p[1].toFixed(4); }).join('|');
  if (routeCache[cacheKey]) {
    drawRoute(routeCache[cacheKey], color, token);
    return;
  }
  showRouteLoading();
  var coordStr = points.map(function(p) { return p[1].toFixed(6) + ',' + p[0].toFixed(6); }).join(';');
  var url = 'https://router.project-osrm.org/route/v1/driving/' + coordStr + '?overview=full&geometries=geojson';
  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.routes && data.routes[0]) {
        var routeCoords = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
        routeCache[cacheKey] = routeCoords;
        drawRoute(routeCoords, color, token);
      }
    })
    .catch(function(err) { console.log('Route fetch failed, keeping straight line:', err); })
    .finally(function() { hideRouteLoading(); });
}

function drawRoute(coords, color, token) {
  if (renderToken !== token) return;
  // Remove temporary dashed placeholder lines
  routePolylines.forEach(function(p) {
    if (p.options.dashArray) { routesLayer.removeLayer(p); }
  });
  routePolylines = routePolylines.filter(function(p) { return !p.options.dashArray; });
  // Draw the real driving route
  var route = L.polyline(coords, { color: color, weight: 4, opacity: 0.8 }).addTo(routesLayer);
  routePolylines.push(route);
}

function showRouteLoading() { document.getElementById('routeLoading').classList.add('show'); }
function hideRouteLoading() { document.getElementById('routeLoading').classList.remove('show'); }

// ========================================================================
// OVERVIEW — show all 12 days on one map
// ========================================================================
function renderOverview() {
  renderToken++;
  var myToken = renderToken;
  markersLayer.clearLayers();
  routesLayer.clearLayers();
  markerGroup = [];
  routePolylines = [];

  // Update tabs
  document.querySelectorAll('.day-tab, .mob-day-tab').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('[data-day="overview"]').forEach(function(el) { el.classList.add('active'); });

  // Update spot panel
  document.getElementById('dayBadge').textContent = '全览';
  document.getElementById('dayTitle').textContent = '法国+瑞士 12天全景';

  var listEl = document.getElementById('spotList');
  listEl.innerHTML = '';
  var allBounds = [];

  // Build itinerary overview in spot panel
  itinerary.forEach(function(day, di) {
    var dayColor = dayColors[di % dayColors.length];

    // Overview item — clickable card
    var ovItem = document.createElement('div');
    ovItem.className = 'overview-item';
    var spotsSummary = day.spots.map(function(s) { return s.name; }).join(' → ');
    ovItem.innerHTML =
      '<div class="oi-header">' +
        '<div class="oi-badge" style="background:' + dayColor + '">' + (di + 1) + '</div>' +
        '<div class="oi-city">' + day.city + '</div>' +
        '<div class="oi-date">' + formatDate(day.date) + ' ' + day.weekday + '</div>' +
      '</div>' +
      '<div class="oi-route">' + spotsSummary + '</div>';
    ovItem.addEventListener('click', function() { renderDay(di); });
    listEl.appendChild(ovItem);

    // Map markers
    day.spots.forEach(function(spot, si) {
      if (spot.lat && spot.lng) {
        var marker = L.marker([spot.lat, spot.lng], {
          icon: L.divIcon({
            className: 'custom-marker',
            html: '<div style="width:24px;height:24px;background:' + dayColor + ';color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #fff;">' + (si + 1) + '</div>',
            iconSize: [24, 24], iconAnchor: [12, 12]
          })
        });
        marker.bindPopup('<strong>' + spot.name + '</strong><br><span style="color:#999;font-size:0.75rem;">' + day.dayLabel + ' · ' + day.city + '</span><br><button onclick="openModal(' + di + ',' + si + ')" style="margin-top:4px;padding:3px 10px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem;">查看详情 →</button>');
        markersLayer.addLayer(marker);
        allBounds.push([spot.lat, spot.lng]);
      }
    });

    // Fetch driving route for this day
    var routePoints = day.spots.filter(function(s) { return s.lat && s.lng; }).map(function(s) { return [s.lat, s.lng]; });
    if (routePoints.length >= 2) {
      var tempRoute = L.polyline(routePoints, { color: dayColor, weight: 1.5, opacity: 0.3, dashArray: '4, 6' }).addTo(routesLayer);
      routePolylines.push(tempRoute);
      // Stagger requests to avoid rate limiting
      setTimeout(function() {
        fetchDrivingRoute(routePoints, dayColor, di, myToken);
      }, di * 400);
    }
  });

  // Remove summary element if exists from day mode
  var oldSummary = document.querySelector('.spot-panel-header .day-summary');
  if (oldSummary) oldSummary.remove();

  if (allBounds.length > 0) {
    map.fitBounds(L.latLngBounds(allBounds), { padding: [50, 50] });
  }
}

// ========================================================================
// MODAL
// ========================================================================
function openModal(dayIdx, spotIdx) {
  var spot = itinerary[dayIdx].spots[spotIdx];
  document.getElementById('modalTitle').textContent = spot.name;
  document.getElementById('modalTitleEn').textContent = spot.nameEn || '';
  document.getElementById('modalIcon').textContent = '📍';

  var html = '';

  // Why visit
  if (spot.whyVisit) {
    html += '<div class="modal-section"><h4>🌟 为什么值得去</h4><p>' + spot.whyVisit + '</p></div>';
  }

  // Ticket info
  if (spot.ticket) {
    html += '<div class="modal-section"><h4>💰 门票信息</h4><p>' + spot.ticket + '</p></div>';
  }

  // Reservation
  if (spot.reservation || spot.reserveUrl) {
    html += '<div class="modal-section"><h4>📋 预约信息</h4>';
    if (spot.reservation) {
      var needReserve = spot.reservation.indexOf('无需') === -1;
      html += '<p><span class="tag ' + (needReserve ? 'tag-red' : 'tag-green') + '">' + (needReserve ? '需要预约' : '无需预约') + '</span></p>';
      html += '<p>' + spot.reservation + '</p>';
    }
    if (spot.reserveUrl) {
      html += '<p style="margin-top:6px;">🔗 <strong>预约地址：</strong><br><a href="' + spot.reserveUrl + '" target="_blank" rel="noopener">' + spot.reserveUrl + '</a></p>';
    }
    html += '</div>';
  }

  // Notes
  if (spot.notes) {
    html += '<div class="modal-section"><h4>💡 小贴士</h4><p>' + spot.notes + '</p></div>';
  }

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Click overlay to close
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// ========================================================================
// HELPERS
// ========================================================================

// Build reservation/status tags for spot list items
function buildSpotTagsHtml(spot) {
  var tags = '';
  if (spot.reservation) {
    var needReserve = spot.reservation.indexOf('无需') === -1;
    tags += '<span class="s-tag ' + (needReserve ? 's-tag-reserve' : 's-tag-noreserve') + '">' + (needReserve ? '需预约' : '免预约') + '</span>';
  }
  if (spot.ticket && spot.ticket !== '' && spot.ticket !== '免费') {
    tags += '<span class="s-tag s-tag-info">' + spot.ticket + '</span>';
  } else if (spot.ticket === '免费') {
    tags += '<span class="s-tag s-tag-noreserve">免费</span>';
  }
  if (!tags) return '';
  return '<div class="spot-tags">' + tags + '</div>';
}

// Build quick info summary line for spot list items
function buildSpotQuickInfoHtml(spot) {
  var parts = [];
  // Extract time info from notes/reservation (e.g. "约3小时参观", "游览约2小时", "2h20min")
    var allText = (spot.notes || '') + ' ' + (spot.reservation || '');
    var timeMatch = allText.match(/(约?\d+[\-~]\d*\.?\d*|约?\d+\.?\d*)(小时|h|min|分钟|mins)/i);
    if (timeMatch) parts.push('<span class="qi-label">时长</span><span class="qi-val">' + timeMatch[0] + '</span>');
  if (spot.reservation) {
    var needReserve = spot.reservation.indexOf('无需') === -1;
    if (needReserve) {
      // Shorten reservation text
      var shortReserve = spot.reservation.replace(/建议提前|强烈建议|必须提前|需提前|请提前/g, '').replace(/！/g, '').trim();
      if (shortReserve.length > 20) shortReserve = shortReserve.substring(0, 20) + '…';
      parts.push('<span class="qi-label">预约</span><span class="qi-val">' + shortReserve + '</span>');
    } else {
      parts.push('<span class="qi-label">预约</span><span class="qi-val" style="color:#16a34a;">无需预约</span>');
    }
  }
  if (spot.reserveUrl) {
    // Extract domain for short display
    try {
      var urlHost = spot.reserveUrl.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
      if (urlHost.length > 30) urlHost = urlHost.substring(0, 30) + '…';
      parts.push('<span class="qi-label">链接</span><a href="' + spot.reserveUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation();">' + urlHost + '</a>');
    } catch(e) {}
  }
  if (spot.ticket) {
    parts.push('<span class="qi-label">价格</span><span class="qi-val">' + spot.ticket + '</span>');
  }
  if (parts.length === 0) return '';
  return '<div class="spot-quick-info">' + parts.join('') + '</div>';
}

function formatDate(dateStr) {
  var d = new Date(dateStr);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

// ========================================================================
// BUILD UI
// ========================================================================
function buildUI() {
  var sidebar = document.getElementById('dayTabs');
  var mobileBar = document.getElementById('mobileDayBar');

  // Overview tab (sidebar)
  var ovTab = document.createElement('button');
  ovTab.className = 'day-tab overview-tab active';
  ovTab.setAttribute('data-day', 'overview');
  ovTab.innerHTML = '<span>🗺️ 全览图 — 查看全部行程路线</span>';
  ovTab.addEventListener('click', function() { renderOverview(); });
  sidebar.appendChild(ovTab);

  // Trip summary card
  var summaryCard = document.createElement('div');
  summaryCard.className = 'trip-summary';
  // Build route string from all days
  var routeCities = [];
  itinerary.forEach(function(day) {
    var cities = day.city.split('→').map(function(c) { return c.trim(); });
    cities.forEach(function(c) {
      if (routeCities.indexOf(c) === -1) routeCities.push(c);
    });
  });
  var routeHtml = routeCities.map(function(c, i) {
    if (i === 0) return c;
    return '<span class="arrow">→</span>' + c;
  }).join(' ');
  summaryCard.innerHTML =
    '<div class="trip-route">' + routeHtml + '</div>' +
    '<div class="trip-dates">' +
      '<span class="trip-badge">12天</span>' +
      '<span>9月25日 — 10月6日</span>' +
    '</div>';
  sidebar.appendChild(summaryCard);

  // Overview tab (mobile)
  var mobOvTab = document.createElement('button');
  mobOvTab.className = 'mob-day-tab active';
  mobOvTab.setAttribute('data-day', 'overview');
  mobOvTab.textContent = '🗺️全览';
  mobOvTab.addEventListener('click', function() { renderOverview(); });
  mobileBar.appendChild(mobOvTab);

  itinerary.forEach(function(day, i) {
    // Parse city route
    var cities = day.city.split('→').map(function(c) { return c.trim(); });
    var cityHtml = cities.map(function(c, ci) {
      if (ci === 0) return c;
      return '<span class="route-arrow">→</span>' + c;
    }).join(' ');

    // Spots preview — first 3 spot names
    var spotsPreview = day.spots.slice(0, 4).map(function(s) { return s.name; }).join(' · ');
    if (day.spots.length > 4) spotsPreview += ' · 等' + day.spots.length + '个景点';

    // Sidebar tab
    var tab = document.createElement('button');
    tab.className = 'day-tab';
    tab.setAttribute('data-day', 'day-' + i);
    tab.innerHTML =
      '<div class="day-num">' + (i + 1) + '</div>' +
      '<div class="day-info">' +
        '<div class="day-city">' + cityHtml + '</div>' +
        '<div class="day-meta">' + formatDate(day.date) + ' ' + day.weekday + '</div>' +
        '<div class="day-spots-preview">' + spotsPreview + '</div>' +
      '</div>';
    tab.addEventListener('click', function() { renderDay(i); });
    sidebar.appendChild(tab);

    // Mobile tab
    var mobTab = document.createElement('button');
    mobTab.className = 'mob-day-tab';
    mobTab.setAttribute('data-day', 'day-' + i);
    mobTab.textContent = (i + 1) + '.' + cities[0];
    mobTab.addEventListener('click', function() { renderDay(i); });
    mobileBar.appendChild(mobTab);
  });
}

// ========================================================================
// START
// ========================================================================
initMap();
buildUI();
renderOverview();
</script>
